// "camo" covers the whole model, so config hiddenSelections can swap the texture (colour variants)
class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	class KPK_Skeleton: Default {};
	// landscape models: on a backpack strap / vest slot the whole model turns along the strap.
	// r1 is the child of r2, r2 the child of move: a vertex is turned by r1, then r2, then moved.
	class KPK_StrapSkeleton: Default
	{
		skeletonBones[] =
		{
			"kpk_strap_move", "",
			"kpk_strap_r2", "kpk_strap_move",
			"kpk_strap_r1", "kpk_strap_r2"
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};
	class kpk: Default
	{
		skeletonName = "KPK_Skeleton";
		sections[] = {"camo"};
	};
	// phase 0: as held in the hands; phase 1 (script, when attached to a slot): along the strap.
	// Both turns are half turns (3.14159 rad), so their direction does not matter.
	class kpk_strap: kpk
	{
		skeletonName = "KPK_StrapSkeleton";
		class Animations
		{
			class kpk_strap_r1
			{
				type = "rotation";
				source = "kpkStrap";
				selection = "kpk_strap_r1";
				axis = "kpk_strap_r1_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = 3.14159265;
			};
			class kpk_strap_r2: kpk_strap_r1
			{
				selection = "kpk_strap_r2";
				axis = "kpk_strap_r2_axis";
			};
			class kpk_strap_move
			{
				type = "translation";
				source = "kpkStrap";
				selection = "kpk_strap_move";
				axis = "kpk_strap_move_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = 0;
				offset1 = 1;
			};
		};
	};
	class kpk_m1: kpk_strap {};
	class kpk_mil: kpk_strap {};
	class kpk_mono: kpk_strap {};
	class kpk_nii: kpk_strap {};
	class kpk_broken: kpk {};
};
