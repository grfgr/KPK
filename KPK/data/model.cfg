// "camo" covers the whole model, so config hiddenSelections can swap the texture (colour variants)
class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	class KPK_Skeleton: Default {};
	// landscape models: two copies of the mesh, as held in the hands and as worn on a strap
	class KPK_StrapSkeleton: Default
	{
		skeletonBones[] = {"kpk_hand", "", "kpk_strap", ""};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};
	class kpk: Default
	{
		skeletonName = "KPK_Skeleton";
		sections[] = {"camo"};
	};
	// the script sets kpkStrap = 1 / kpkHand = 0 while the KPK is attached to a slot, the other way round
	// otherwise: one copy of the mesh is hidden, the other shown
	class kpk_strap: kpk
	{
		skeletonName = "KPK_StrapSkeleton";
		class Animations
		{
			class kpk_hand_hide
			{
				type = "hide";
				source = "kpkStrap";
				selection = "kpk_hand";
				minValue = 0;
				maxValue = 1;
				hideValue = 0.5;
			};
			class kpk_strap_hide
			{
				type = "hide";
				source = "kpkHand";
				selection = "kpk_strap";
				minValue = 0;
				maxValue = 1;
				hideValue = 0.5;
			};
		};
	};
	class kpk_m1: kpk_strap {};
	class kpk_mil: kpk_strap {};
	class kpk_mono: kpk_strap {};
	class kpk_nii: kpk_strap {};
	class kpk_broken: kpk {};
};
