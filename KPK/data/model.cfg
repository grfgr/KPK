// "camo" covers the whole model, so config hiddenSelections can swap the texture (colour variants)
class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	class KPK_Skeleton: Default {};
	// every model holds three copies of the mesh: in the hands, on a strap, free (inventory / ground)
	class KPK_PoseSkeleton: Default
	{
		skeletonBones[] = {"kpk_hand", "", "kpk_strap", "", "kpk_free", ""};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};
	class kpk_base: Default
	{
		skeletonName = "KPK_Skeleton";
		sections[] = {"camo"};
	};
	// the script sets kpkNotHand / kpkNotStrap / kpkNotFree: 0 for the place the KPK is in, 1 for the
	// others; a copy is hidden while its source is 1 (default: free copy shown)
	class kpk_pose: kpk_base
	{
		skeletonName = "KPK_PoseSkeleton";
		class Animations
		{
			class kpk_hand_hide
			{
				type = "hide";
				source = "kpkNotHand";
				selection = "kpk_hand";
				minValue = 0;
				maxValue = 1;
				hideValue = 0.5;
			};
			class kpk_strap_hide: kpk_hand_hide
			{
				source = "kpkNotStrap";
				selection = "kpk_strap";
			};
			class kpk_free_hide: kpk_hand_hide
			{
				source = "kpkNotFree";
				selection = "kpk_free";
			};
		};
	};
	class kpk: kpk_pose {};
	class kpk_m1: kpk_pose {};
	class kpk_mil: kpk_pose {};
	class kpk_mono: kpk_pose {};
	class kpk_nii: kpk_pose {};
	class kpk_broken: kpk_pose {};
};
